[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turnout-lab"
version = "0.1.0"
description = "Leakage-aware event attendance forecasting and no-show prioritization."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Yash Abhichandani" }]
dependencies = [
  "joblib==1.5.2",
  "jupyter==1.1.1",
  "matplotlib==3.10.6",
  "nbclient==0.10.2",
  "nbformat==5.10.4",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "plotly==6.3.1",
  "pydantic==2.12.0",
  "scikit-learn==1.7.2",
  "streamlit==1.50.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.0",
]

[project.scripts]
turnout-lab = "turnout_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
