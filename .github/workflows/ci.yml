name: Verify Turnout Lab

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ruff check app.py src scripts tests
      - run: uv run pytest
